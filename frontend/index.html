<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="styles/main.css">
  <title>SmartLine</title>
</head>
<body>

  <div id="app">

    <!-- Botão de logout — fixado no canto superior direito, ao lado do tema -->
    <button id="btn-logout" aria-label="Sair" style="display:none;">
      <img id="icon-logout" src="icons/security/logout.svg" width="18" height="18" alt="Sair">
    </button>

    <!-- Botão de tema global -->
    <button id="btn-theme-toggle" aria-label="Alternar tema">
      <svg id="icon-sun" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>
      <svg id="icon-moon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
    </button>

    <div id="page-container">
      <!-- Pages loaded here dynamically -->
    </div>

    <nav id="navbar">
      <button class="nav-btn active" data-page="medicao">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
        <span>Medição</span>
      </button>

      <button class="nav-btn nav-btn-center" data-page="overview">
        <img src="icons/sanmartin/sanmartin_logo.svg" width="30" height="30" alt="Overview">
      </button>

      <button class="nav-btn" data-page="config">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83-2.83l.06-.06A1.65 1.65 0 004.68 15a1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 012.83-2.83l.06.06A1.65 1.65 0 009 4.68a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z"/></svg>
        <span>Config</span>
      </button>
    </nav>
  </div>

<!-- MODAL GLOBAL: PRODUÇÃO PERIÓDICA -->
  <!-- Disparado automaticamente a cada X minutos durante medição ativa. -->
  <!-- O campo de refugo só aparece se a máquina tiver "Controla refugo" habilitado. -->
  <div class="modal-overlay hidden" id="modal-production">
    <div class="modal">
      <h3>Informe a produção</h3>
      <p class="modal-sub">Valor atual do contador da máquina</p>
      <div class="form-group">
        <label>Produção atual <span style="color:var(--red)">*</span></label>
        <input type="number" id="production-input" placeholder="Ex: 4500" class="input input-lg" inputmode="numeric">
      </div>
      <div class="form-group" id="refugo-group" style="margin-top:12px;display:none;">
        <label>Refugo acumulado <span style="font-size:0.7rem;color:var(--text-dim);font-weight:400;">(opcional)</span></label>
        <input type="number" id="refugo-input" placeholder="Ex: 12" class="input input-lg" inputmode="numeric">
      </div>
      <button class="btn btn-primary btn-block" id="btn-confirm-production" style="margin-top:4px;">Confirmar</button>
    </div>
  </div>

  <!-- MODAL GLOBAL: FIM DE TURNO -->
  <div class="modal-overlay hidden" id="modal-shift-end">
    <div class="modal">
      <h3>Fim do turno</h3>
      <p class="modal-sub">O horário de fim do turno foi atingido</p>
      <p id="shift-end-countdown" style="font-size:0.75rem;color:var(--red);text-align:center;margin-bottom:12px;font-weight:600;"></p>
      <button class="btn btn-danger btn-block" id="btn-end-shift" style="margin-bottom: 12px;">Finalizar medição</button>
      <p class="modal-sub">Ou defina um novo horário de fim:</p>
      <input type="time" id="new-shift-end-input" class="input" style="margin-bottom: 12px;">
      <button class="btn btn-outline btn-block" id="btn-extend-shift">Estender turno</button>
    </div>
  </div>

  <!-- MODAL GLOBAL: VISUALIZADOR DE IMAGEM -->
  <div class="modal-overlay hidden" id="modal-image-viewer" style="z-index: 9999;">
    <div class="modal" style="padding: 10px; max-width: 90vw; text-align: center; background: transparent; box-shadow: none;">
      <button type="button" class="modal-maquina-fechar" id="modal-image-fechar" style="position:absolute; top:-30px; right:0; background:var(--card-bg); border-radius:50%; padding:5px; cursor:pointer; color:var(--text); border:none; display:flex; align-items:center; justify-content:center;">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
      <img id="image-viewer-img" src="" style="max-width: 100%; max-height: 80vh; border-radius: 8px; object-fit: contain; background: black;" alt="Foto do evento">
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
  <script src="scripts/main.js?v=8" type="module"></script>
</body>
</html>
