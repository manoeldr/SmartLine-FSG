<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <title>BottleLine Audit</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="styles/main.css">
</head>
<body>

  <div id="app">
    <div id="page-container">
      <!-- Pages loaded here dynamically -->
    </div>

    <nav id="navbar">
      <button class="nav-btn active" data-page="overview">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
        <span>Overview</span>
      </button>
      <button class="nav-btn" data-page="medicao">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
        <span>Medição</span>
      </button>
      <button class="nav-btn" data-page="paradas">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
        <span>Paradas</span>
      </button>
      <button class="nav-btn" data-page="config">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83-2.83l.06-.06A1.65 1.65 0 004.68 15a1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 012.83-2.83l.06.06A1.65 1.65 0 009 4.68a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z"/></svg>
        <span>Config</span>
      </button>
    </nav>
  </div>

  <!-- MODAL GLOBAL: PRODUÇÃO PERIÓDICA -->
  <div class="modal-overlay hidden" id="modal-production">
    <div class="modal">
      <h3>Informe a produção</h3>
      <p class="modal-sub">Valor atual do contador da máquina</p>
      <input type="number" id="production-input" placeholder="Ex: 4500" class="input input-lg" inputmode="numeric">
      <button class="btn btn-primary" id="btn-confirm-production">Confirmar</button>
    </div>
  </div>

  <!-- MODAL GLOBAL: FIM DE TURNO -->
  <div class="modal-overlay hidden" id="modal-shift-end">
    <div class="modal">
      <h3>Fim do turno</h3>
      <p class="modal-sub">O horário de fim do turno foi atingido</p>
      <p id="shift-end-countdown" style="font-size:0.75rem;color:var(--red);text-align:center;margin-bottom:12px;font-weight:600;"></p>
      <button class="btn btn-danger btn-block" id="btn-end-shift" style="margin-bottom: 12px;">Finalizar medição</button>
      <p class="modal-sub">Ou defina um novo horário de fim:</p>
      <input type="time" id="new-shift-end-input" class="input" style="margin-bottom: 12px;">
      <button class="btn btn-outline btn-block" id="btn-extend-shift">Estender turno</button>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
  <script src="scripts/main.js?v=3" type="module"></script>
</body>
</html>
