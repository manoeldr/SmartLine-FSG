<div class="page page-config">
  <header class="page-header">
    <h1>Configuração</h1>
    <!-- Botão de gestão de usuários — visível apenas para admin -->
    <button type="button" id="cfg-usuarios-btn" class="hidden" style="background:none;border:none;cursor:pointer;color:var(--text-dim);display:flex;align-items:center;padding:4px;">
      <img src="icons/security/adm_config.svg" width="26" height="26" alt="Usuários" style="filter: var(--icon-filter, none);">
    </button>
  </header>

  <!-- SEÇÃO 1: CLIENTE -->
  <div class="section-card">
    <h3>Cliente</h3>
    <div class="form-group">
      <label>Selecionar cliente</label>
      <span id="cfg-cliente-loading" class="hidden" style="font-size:0.8rem;color:var(--text-dim)">Carregando...</span>
      <select id="cfg-cliente-select" class="input">
        <option value="">Selecione um cliente...</option>
      </select>
    </div>
    <div class="form-row" style="margin-top:8px">
      <input type="text" id="cfg-cliente-novo" class="input flex-1" placeholder="Novo cliente...">
      <button type="button" class="btn btn-sm" id="cfg-cliente-add-btn">+</button>
    </div>
  </div>

  <!-- SEÇÃO 2: LINHA -->
  <div class="section-card hidden" id="cfg-linha-section">
    <h3>Linha de produção</h3>
    <div class="form-group">
      <label>Selecionar linha</label>
      <select id="cfg-linha-select" class="input">
        <option value="">Selecione uma linha...</option>
      </select>
    </div>
    <div class="form-row" style="margin-top:8px">
      <input type="text" id="cfg-linha-nova" class="input flex-1" placeholder="Nova linha...">
      <button type="button" class="btn btn-sm" id="cfg-linha-add-btn">+</button>
    </div>
  </div>

  <!-- SEÇÃO 3: FLUXO DA LINHA -->
  <div class="section-card hidden" id="cfg-maquinas-section">
    <h3>Fluxo da linha</h3>
    <div id="cfg-maquinas-list"></div>
    <div class="form-row" style="margin-top:12px">
      <input type="text" id="cfg-maquina-nova" class="input flex-1" placeholder="Nome da máquina...">
      <button type="button" class="btn btn-sm" id="cfg-maquina-add-btn">+</button>
    </div>
  </div>

  <!-- SEÇÃO 4: CONFIGURAÇÃO DA MEDIÇÃO -->
  <div class="section-card">
    <h3>Configuração da medição</h3>
    <div class="form-row">
      <div class="form-group flex-1">
        <label>Início do turno</label>
        <input type="time" id="cfg-shift-start" class="input" value="08:00">
      </div>
      <div class="form-group flex-1">
        <label>Fim do turno</label>
        <input type="time" id="cfg-shift-end" class="input" value="17:00">
      </div>
    </div>
    <div class="form-group">
      <label>Intervalo para solicitar produção (minutos)</label>
      <input type="number" id="cfg-prod-interval" class="input" value="30" inputmode="numeric">
    </div>
  </div>

  <button type="button" class="btn btn-primary btn-block" id="cfg-save-btn">Salvar configuração</button>

  <!-- ZONA DE PERIGO -->
  <div class="section-card danger-zone" style="margin-top:12px;">
    <h3>Zona de perigo</h3>
    <button type="button" class="btn btn-danger btn-block" id="cfg-reset-btn">Resetar medição atual</button>
    <p class="danger-text">Isso apaga todos os dados da medição em andamento</p>
  </div>
</div>
